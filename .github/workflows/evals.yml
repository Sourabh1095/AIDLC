# Bee-Logical AIDLC — behavioural evals (on demand).
#
# The unit suites in ci.yml pin the scripts; these pin the prompts, by running real Claude sessions
# against a sample repo with and without the plugin (plugins/aidlc-core/evals/README.md). They cost
# money and take minutes, so they run only when asked: before a release, or after a change to a skill
# or agent prompt. Needs the ANTHROPIC_API_KEY repository secret.

name: Evals

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Trials per case"
        default: "3"
      case:
        description: "Case name glob (blank = all)"
        default: ""

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure git identity for the fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "AIDLC CI"
      # Pinned: the eval CLI's flags and report schema are versioned with Claude Code.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: Run the suite
        working-directory: plugins/aidlc-core
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . --trust-plugin --scaffold --no-publish \
            --allow-tools Write Edit --disallow-tools Agent TaskStop \
            --model sonnet --runs "${{ inputs.runs }}" --threshold 0.67 --max-cost-usd 15 \
            ${{ inputs.case && format('--case "{0}"', inputs.case) || '' }} \
            --json "$RUNNER_TEMP/evals.json"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            plugins/aidlc-core/evals/results/
            ${{ runner.temp }}/evals.json
